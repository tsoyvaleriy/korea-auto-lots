<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korea Auto Lots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@300;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KoreaAutoLots">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css?v=1227f7386a">
<script>
  // тема: сохранённая или системная — до отрисовки, чтобы не мигало
  (function () { var t; try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; })();
</script>
<script src="i18n_ui.js?v=323686f300"></script>
<script src="i18n.js?v=1c0b9f8d95"></script>
</head>
<body>
<header class="top">
  <div class="brand">Korea<b>Auto</b>Lots</div>
  <nav class="tabs" id="tabs">
    <button data-tab="whole" class="active">Autohub <span></span></button>
    <button data-tab="kcar">K Car <span></span></button>
    <button data-tab="heydealer">HeyDealer <span></span></button>
    <button data-tab="damaged">Битые <span></span></button>
    <button data-tab="wish" class="in-cab">♥ Избранное <span></span></button>
  </nav>
  <span id="langBox"></span>
  <button class="icon-btn" id="themeBtn" title="Светлая / тёмная тема" aria-label="Сменить тему">◐</button>
</header>

<div class="layout">
  <aside class="filters" id="filters">
    <div class="f-head">
      <h3>Фильтры</h3>
      <span><button class="link" id="saveSearch" hidden title="Уведомлять в Telegram о новых лотах по этим фильтрам">☆ Сохранить поиск</button>
      <button class="link" id="reset">Сбросить</button></span>
    </div>
    <input id="q" type="search" placeholder="Марка, модель, № лота, VIN…">

    <div class="f-group"><label>Аукцион</label><div id="fSource" class="chips"></div></div>
    <div class="f-group" id="gHd" hidden><label>Формат торгов HeyDealer</label><div id="fHd" class="chips"></div></div>
    <div class="f-group"><label>Автомобили</label><div id="fOrigin" class="chips"></div></div>
    <div class="f-group"><label>Марка</label><select id="fMake"><option value="">Все марки</option></select></div>
    <div class="f-group"><label>Модель</label><select id="fModel"><option value="">Все модели</option></select></div>
    <div class="f-group"><label>Год</label>
      <div class="range"><select id="fYearFrom"></select><span>—</span><select id="fYearTo"></select></div></div>
    <div class="f-group" id="gPrice"><label>Стартовая цена, $</label>
      <div class="range"><input id="fPriceFrom" type="number" min="0" step="500" placeholder="от"><span>—</span><input id="fPriceTo" type="number" min="0" step="500" placeholder="до"></div></div>
    <div class="f-group"><label>Пробег до, км</label>
      <input id="fMileage" type="range" min="0" max="200000" step="5000" value="200000"><div class="hint" id="fMileageLbl"></div></div>
    <div class="f-group"><label>Топливо</label><div id="fFuel" class="chips"></div></div>
    <div class="f-group"><label>КПП</label><div id="fTm" class="chips"></div></div>
    <div class="f-group"><label>Состояние</label>
      <label class="check"><input type="checkbox" id="fSheet"> Есть лист осмотра</label>
      <label class="check"><input type="checkbox" id="fNoReplace"> Без замен деталей</label>
      <label class="check"><input type="checkbox" id="fPrice"> Только с ценой</label>
      <label class="check"><input type="checkbox" id="fActive" checked> Скрыть завершённые торги</label>
    </div>
  </aside>

  <main>
    <div id="cabNav" class="cab-nav" hidden>
      <h2>Личный кабинет</h2>
      <div class="cab-tabs"><button data-cab="bids">Мои ставки <span></span></button><button data-cab="wish">♥ Избранное <span></span></button></div>
    </div>
    <div class="toolbar">
      <button class="btn-filters" id="openFilters">Фильтры</button>
      <div id="count" class="count"></div>
      <div id="activeChips" class="active-chips"></div>
      <select id="sort">
        <option value="ends">Скоро завершатся</option>
        <option value="priceAsc">Цена ↑</option>
        <option value="priceDesc">Цена ↓</option>
        <option value="yearDesc">Год: новее</option>
        <option value="mileageAsc">Пробег ↑</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
    <button id="more" class="more" hidden>Показать ещё</button>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-bg" data-close></div>
  <article class="modal-box" id="modalBox"></article>
</div>

<footer class="foot" id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=b9c2b99744"></script>
<script src="app.js?v=9a44c610a1"></script>
<script src="portal.js?v=28cf6ef51b"></script>
<script>
  document.getElementById('langBox').innerHTML = I18N.switcher();
  document.getElementById('themeBtn').onclick = function () {
    var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (e) {}
  };
</script>
</body>
</html>
